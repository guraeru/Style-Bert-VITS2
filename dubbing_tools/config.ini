[paths]
# 入力フォルダー（input_mp4内の全ファイルを処理）
input_dir = \\192.168.11.6\Pi-NAS\Coloso
# 出力フォルダー
output_dir = \\192.168.11.6\Pi-NAS\CV宮舞モカ_Coloso

[model]
# モデル名（model_assets内のフォルダー名）
name = miyamae_moca
# デバイス: cuda または cpu
device = cuda

[audio]
# 元音声に重ねる(true) / 置き換える(false)
# ※ false推奨: 1-1などは冒頭5秒のみ重ねる、1-2以上は完全削除
overlay = false
# 生成音声の音量 (0.0 - 2.0)
audio_volume = 1.0
# 元音声の音量 (overlayがtrueの場合)
original_volume = 0.0

[processing]
# テスト用: 最初の3件だけ処理 (true/false)
intro_only = false
# 既存ファイルをスキップ (true/false)
skip_existing = true

[async_io]
# 非同期IO処理を有効化 (共有ストレージ使用時に推奨)
enable = true
# ダウンロードプールサイズ（何件先までダウンロードするか）
# 大きいほどダウンロード待ち時間を削減できますが、メモリ使用量が増加します
download_pool_size = 3
# 最大アップロードスレッド数（同時アップロード数）
# 大きいほどアップロード時間を短縮できますが、ネットワーク負荷が増加します
max_upload_threads = 2
